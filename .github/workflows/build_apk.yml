name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project structure
        run: flutter create --platforms=android --org com.klprestigetable --project-name app .

      - name: Copy google-services.json
        run: cp firebase-config/google-services.json android/app/google-services.json

      - name: Register google-services plugin in settings.gradle
        run: |
          sed -i '/id "org.jetbrains.kotlin.android" version/a\    id "com.google.gms.google-services" version "4.4.0" apply false' android/settings.gradle

      - name: Update Kotlin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle

      - name: Update Android Gradle Plugin version
        run: |
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.3.0"/' android/settings.gradle

      - name: Update Gradle wrapper version
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Update compileSdk to 35
        run: |
          sed -i 's/flutter.compileSdkVersion/35/' android/app/build.gradle

      - name: Apply google-services plugin in app build.gradle
        run: |
          sed -i '/id "kotlin-android"/a\    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
