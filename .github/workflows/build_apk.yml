name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project structure
        run: flutter create --platforms=android --org com.klprestigetable --project-name kl_prestige_table .

      - name: Copy google-services.json
        run: cp firebase-config/google-services.json android/app/google-services.json

      - name: Add Google services plugin to project build.gradle
        run: |
          sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'/" android/build.gradle

      - name: Add Google services plugin to app build.gradle
        run: |
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
